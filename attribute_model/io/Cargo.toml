[package]
name = "attribute_io"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "attribute_io"
path = "src/main.rs"

[dependencies]
mimalloc = { version = "0.1", default-features = false }
ureq = { version = "2", default-features = false }
crossbeam-channel = "0.5"
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
serde_json = "1"
half = "2"
sha2 = "0.10"

[profile.release]
opt-level = 3
debug = false
codegen-units = 16
incremental = true
