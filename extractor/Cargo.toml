[workspace]
resolver = "2"
members = ["claimcore", "extractor", "demographics", "location", "life", "work", "health", "fandom"]

[workspace.dependencies]
claimcore = { path = "claimcore" }

[profile.release]
opt-level = 3
debug = false
codegen-units = 16
incremental = true

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
incremental = false
